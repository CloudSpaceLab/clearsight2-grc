<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClearSight — Framework adoption wizard</title><link rel="stylesheet" href="reference.css"><link rel="stylesheet" href="wizard.css"></head>
<body>
<!-- Reference shell is generated from the archived framework-adoption.html; see README.md. -->
<div id="reference-shell"></div>
<template id="wizard-content">
<a class="skip-link" href="#wizard-main">Skip to wizard</a>
<main class="content adoption-page" id="wizard-main">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="library.html">Frameworks</a><span aria-hidden="true">›</span><span>NIST CSF 2.0</span><span aria-hidden="true">›</span><strong>Adopt framework</strong></nav>
  <header class="adoption-heading"><div class="heading-text"><div class="eyebrow">FRAMEWORK ADOPTION</div><h1>NIST CSF 2.0</h1><p>Review requirements, confirm monitoring and assign the people who will respond.</p><div class="heading-meta"><span class="mini-label tint">NIST CSF 2.0</span><span class="mini-label neutral">Bank template · sample</span><span class="mini-label" id="draft-badge">Unsaved draft</span></div></div><div class="header-actions"><span class="prototype-note"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>Illustrative design data</span><button class="button secondary" id="save-draft">Save draft</button></div></header>
  <section class="panel rail-inner iso-lifecycle" id="iso-lifecycle" aria-label="Program and adoption review" hidden></section>
  <section class="panel context-panel" aria-label="Program and scope"><label class="field" for="program-select"><span class="field-label">Program</span><select id="program-select"><option value="cloud">CBN-CLOUD-ENC-01 · Nigeria cloud data protection</option><option value="security">ISMS-01 · Information security management</option></select></label><div class="scope-copy"><span class="field-label">Program scope · Clear Bank Nigeria</span><p id="scope-copy"></p></div></section>
  <nav class="wizard-steps" aria-label="Adoption steps"><ol>
    <li><button data-step="1" aria-current="step"><span class="step-number">1</span><span><strong>Requirements & questions</strong><small id="step-1-status">Review the defaults</small></span><span class="step-tick" aria-hidden="true"></span></button></li>
    <li><button data-step="2"><span class="step-number">2</span><span><strong>Monitoring & quality</strong><small id="step-2-status">Confirm question settings</small></span><span class="step-tick" aria-hidden="true"></span></button></li>
    <li><button data-step="3"><span class="step-number">3</span><span><strong>Owner & respondents</strong><small id="step-3-status">Assign responsibility</small></span><span class="step-tick" aria-hidden="true"></span></button></li>
  </ol></nav>
  <div id="page-error" class="validation-error" role="alert" hidden></div>
  <div id="proposal-receipt" class="receipt panel" hidden></div>
  <div class="wizard-layout"><div id="step-content" class="wizard-main"></div>
  <aside class="adoption-rail" aria-label="Setup summary"><section class="panel"><div class="rail-inner"><div class="rail-heading"><h2>Adoption summary</h2><span class="summary-dot" id="proposal-status">Draft</span></div><div class="progress-display"><strong id="completed-count">0 of 3</strong><span>steps ready</span></div><div class="progress" role="progressbar" aria-label="Setup readiness" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><span id="progress-fill"></span></div><div class="progress-detail"><span>Configuration only</span><span>Not a compliance score</span></div><dl class="summary-facts" id="summary-facts"></dl><div class="notice">Your edits apply to this Program. The original framework requirements stay unchanged.</div><button id="review-summary" class="text-button summary-link">Review selected requirements →</button></div></section><section class="panel source-panel"><div class="visual-rail"><span class="crest">NIST</span><svg class="grid-art" viewBox="0 0 170 100" fill="none" aria-hidden="true"><path d="M7 68 45 26 78 54 111 11 157 43 125 84 78 54 18 92 45 26 125 84" stroke="currentColor"/></svg></div><div class="rail-inner"><div class="source-head"><h2>Edition details</h2><a href="https://doi.org/10.6028/NIST.CSWP.29" target="_blank" rel="noopener">Source ↗</a></div><div class="source-facts"><div><small>Publisher</small><strong>NIST</strong></div><div><small>Edition</small><strong>2.0 · 2024</strong></div><div><small>Reference</small><strong>CSWP 29</strong></div><div><small>Requirements</small><strong>Sample bank template</strong></div></div><p class="source-note">The requirement wording, questions, settings and people in this prototype are illustrative bank examples. They are not official NIST requirements or a published catalog release.</p></div></section></aside></div>
  <footer class="wizard-footer"><button class="button secondary" id="back-step">Back</button><span id="footer-copy">Step 1 of 3</span><button class="button primary" id="next-step">Continue to monitoring <span aria-hidden="true">→</span></button></footer>
  <p class="prototype-footnote">Prototype only. No Program, assessment, external API request or approval is created.</p>
</main>
<dialog id="wizard-dialog" aria-labelledby="dialog-title"><div class="modal-heading"><div><span class="eyebrow" id="dialog-kicker"></span><h2 id="dialog-title"></h2></div><button class="icon-button" id="dialog-close" aria-label="Close dialog">×</button></div><div id="dialog-content"></div><div id="dialog-error" class="validation-error" role="alert" hidden></div><div class="modal-actions"><button class="button secondary" id="dialog-cancel">Cancel</button><button class="button primary" id="dialog-confirm">Save</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</template>
<script src="reference-shell.js"></script><script type="module" src="wizard.source.js"></script>
</body></html>
