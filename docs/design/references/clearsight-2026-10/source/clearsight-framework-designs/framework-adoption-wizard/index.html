.content.adoption-page{padding:28px 38px 44px;max-width:1880px}

.adoption-grid{display:grid;grid-template-columns:minmax(0,1fr) 375px;align-items:start;gap:18px}
.adoption-main{display:grid;gap:16px;min-width:0}.adoption-rail{display:grid;gap:16px;min-width:0}

.panel-title{display:flex;align-items:center;gap:12px;min-width:0}

.section-link:hover{color:#104db8}.section-link .icon{width:15px;height:15px}

.field{min-width:0;display:grid;gap:8px}.field label,.field .field-label{font-size:10px;letter-spacing:.03em;color:#7c90b0;font-weight:720}

.select-wrap svg{width:17px;height:17px;color:#7196cf}

function customize(r){const v=draft().decisions[r.id];openModal('Customize requirement','PROGRAM COPY',`<p>The framework’s original requirement stays unchanged.</p><div class="edit-fields"><div class="original-text"><strong>Framework original · ${r.code}</strong><br>${esc(r.title)}<br>${esc(r.text)}</div><label for="custom-title">Program requirement title<input id="custom-title" maxlength="200" value="${esc(v.title)}"></label><label for="custom-text">Program requirement wording<textarea id="custom-text" aria-label="Program requirement wording" maxlength="4000" rows="5">${esc(v.text)}</textarea></label><label for="custom-reason">Reason for the change<textarea id="custom-reason" aria-label="Reason for the change" maxlength="1000" rows="2" placeholder="Explain why this Program needs different wording">${esc(v.mode==='custom'?v.reason:'')}</textarea></label></div>`,'Save Program edit',()=>{const title=$('#custom-title').value.trim(),text=$('#custom-text').value.trim(),reason=$('#custom-reason').value.trim();if(!title||!text||!reason)return 'Add the title, requirement wording and reason for the change.';draft().decisions[r.id]={mode:'custom',title,text,reason};draft().settingsReviewed=draft().settingsReviewed.filter(id=>id!==r.id);change();render();announce('Program requirement updated. Framework original unchanged.');return true},{onClose:()=>{if(draft().step===1){rows();detail()}}});}
function exclude(r){openModal('Exclude requirement','PROGRAM SCOPE',`<p>${esc(r.title)}</p><p>The requirement and its linked questions will be left out of this Program. The framework template is unchanged.</p><label class="field-stack" for="exclude-reason"><span>Reason for excluding</span><textarea id="exclude-reason" aria-label="Reason for excluding" maxlength="1000" rows="3">${esc(draft().decisions[r.id].mode==='exclude'?draft().decisions[r.id].reason:'')}</textarea></label>`,'Exclude from Program',()=>{const reason=$('#exclude-reason').value.trim();if(!reason)return 'Explain why the requirement is outside this Program.';draft().decisions[r.id]={mode:'exclude',title:r.title,text:r.text,reason};draft().settingsReviewed=draft().settingsReviewed.filter(id=>id!==r.id);change();render();return true},{onClose:()=>{if(draft().step===1){rows();detail()}}});}
function stepTwo(){const d=draft(),selected=included(d),questions=selected.flatMap(r=>r.questions),expiring=questions.filter(q=>d.settings[q.id].expiry).length,smart=questions.filter(q=>d.settings[q.id].smart).length;return `<section class="panel">${panelHeading(2,'Review monitoring & quality','Confirm the settings on each linked question group.')}<p class="intro-copy">Answer validity determines when a response needs refreshing. Quality checks flag answers for review; they do not approve evidence.</p><div class="settings-metrics"><span><strong>${questions.length}</strong> linked questions</span><span><strong>${expiring}</strong> with answer expiry</span><span><strong>${smart}</strong> smart question${smart===1?'':'s'}</span></div>${selected.map(r=>`<section class="question-group" aria-label="${esc(r.form)} settings"><div class="group-heading"><div><h3>${esc(d.decisions[r.id].title)}</h3><p>${esc(r.form)} · ${r.reference}</p></div><button class="text-button" data-view-group="${r.id}">View questions</button></div>${r.questions.map(q=>{const s=d.settings[q.id];return `<div class="question-setting-row"><div><strong>${esc(q.text)}</strong><div class="setting-tags"><span class="badge">${q.type}</span><span class="badge ${s.expiry?'custom':''}">${s.expiry?`${s.days}-day validity`:'No expiry'}</span>${s.evidence?'<span class="badge">Evidence required</span>':''}${s.smart?'<span class="badge custom">Smart validation · sample</span>':''}</div></div><button class="text-button" data-question-settings="${q.id}" aria-label="Review settings for ${esc(q.text)}">Review settings →</button></div>`}).join('')}<label class="review-toggle"><input type="checkbox" data-reviewed="${r.id}"${checked(d.settingsReviewed.includes(r.id))}><span>Settings reviewed for ${esc(r.form)}</span></label></section>`).join('')}</section>`;}
function questionSettings(id){const r=requirements.find(r=>r.questions.some(q=>q.id===id)),q=r.questions.find(q=>q.id===id),s=draft().settings[id];openModal('Question settings',r.form,`<p><strong>${esc(q.text)}</strong></p><p>Changes apply to this Program’s question settings. Default form settings stay unchanged.</p><section class="settings-section"><h3>Answer validity</h3><label class="check-line"><input id="expiry-enabled" type="checkbox"${checked(s.expiry)}>Expire the answer after a period</label><div class="sub-fields" id="expiry-fields"${s.expiry?'':' hidden'}><label class="field-stack" for="expiry-days"><span>Valid for (days)</span><input id="expiry-days" type="number" min="1" max="3650" step="1" value="${s.days}"></label><span class="setting-help">Measured from submission. Expired answers need refreshing.</span></div></section><section class="settings-section"><h3>Data quality controls</h3><label class="check-line"><input id="evidence-required" type="checkbox"${checked(s.evidence)}>Require supporting evidence</label><p class="setting-help">A supporting file must be present before the answer is ready for review.</p><label class="check-line"><input id="smart-enabled" type="checkbox"${checked(s.smart)}>Validate using an external API (smart question)</label><div class="smart-fields" id="smart-fields"${s.smart?'':' hidden'}><label class="field-stack" for="smart-connector"><span>Approved connection · sample</span><select id="smart-connector"><option value="">Select a connection</option><option value="cloud-config"${s.connector==='cloud-config'?' selected':''}>Cloud configuration inventory · sample</option><option value="identity"${s.connector==='identity'?' selected':''}>Identity directory · sample</option></select></label><label class="field-stack" for="smart-rule"><span>Validation rule</span><select id="smart-rule"><option value="">Select a rule</option><option value="encryption"${s.rule==='encryption'?' selected':''}>All in-scope stores have encryption enabled</option><option value="access"${s.rule==='access'?' selected':''}>Privileged access review is current</option><option value="monitoring"${s.rule==='monitoring'?' selected':''}>All in-scope services send security events</option></select></label><p class="setting-help">A failed check or unavailable source is flagged for review. It never becomes a passing result.</p><div class="sample-validation"><label class="field-stack" for="sample-scenario"><span>Sample API result</span><select id="sample-scenario"><option value="pass">Matching result</option><option value="fail">Mismatched result</option><option value="unavailable">Connection unavailable</option></select></label><button class="button secondary" id="run-sample">Run sample validation</button><div id="sample-result" class="sample-result" role="status" hidden></div><p class="setting-help">Simulated response only. No external service is called.</p></div></div></section>`,'Save settings',()=>{const settings={expiry:$('#expiry-enabled').checked,days:Number($('#expiry-days').value),evidence:$('#evidence-required').checked,smart:$('#smart-enabled').checked,connector:$('#smart-connector').value,rule:$('#smart-rule').value};const problem=validateSettings(settings);if(problem)return problem;draft().settings[id]=settings;draft().settingsReviewed=draft().settingsReviewed.filter(value=>value!==r.id);change();render();announce('Question settings saved. Review this question group again.');return true});
$('#expiry-enabled').onchange=()=>{$('#expiry-fields').hidden=!$('#expiry-enabled').checked};$('#smart-enabled').onchange=()=>{$('#smart-fields').hidden=!$('#smart-enabled').checked};
$('#smart-connector').onchange=()=>{if($('#smart-connector').value==='identity'&&$('#smart-rule').value!=='access')$('#smart-rule').value='';if($('#smart-connector').value==='cloud-config'&&$('#smart-rule').value==='access')$('#smart-rule').value='';$('#sample-result').hidden=true;limitRules()};
function limitRules(){const connection=$('#smart-connector').value;for(const opt of $('#smart-rule').options){opt.disabled=!!opt.value&&(connection==='identity'?opt.value!=='access':connection==='cloud-config'?opt.value==='access':false)}}limitRules();
$('#smart-rule').onchange=()=>{$('#sample-result').hidden=true};$('#sample-scenario').onchange=()=>{$('#sample-result').hidden=true};$('#run-sample').onclick=()=>{const output=$('#sample-result'),p=validateSettings({expiry:false,smart:true,connector:$('#smart-connector').value,rule:$('#smart-rule').value});output.hidden=false;if(p){output.dataset.status='unavailable';output.textContent=p;return}const scenario=$('#sample-scenario').value;output.dataset.status=scenario;output.textContent={pass:'Sample check matched. The supplied test result satisfies this rule. Evidence still needs independent review.',fail:'Sample check failed. The supplied test result does not satisfy this rule. Flag the answer for review.',unavailable:'Sample connection unavailable. Validation could not run; the answer must remain unverified.'}[scenario]};}
function stepThree(){const d=draft();return `<section class="panel">${panelHeading(3,'Assign owner & respondents','Choose who owns this Program and who supplies the answers.')}<div class="assignment-body"><section><label class="field-stack" for="program-owner"><span>Program Owner</span><select id="program-owner"><option value="">Select a Program Owner</option>${owners.map(o=>`<option value="${o.id}"${o.id===d.owner?' selected':''}>${o.name} · ${o.role}</option>`).join('')}</select></label><div id="selected-owner"></div><p class="assignment-description">The owner coordinates assessment work and follows up on gaps. This selection does not grant system permissions.</p></section><section><div class="assignment-label">Respondent departments / units</div><p class="assignment-description">Choose one or more units to complete the linked assessment questions.</p><div class="department-list">${departments.map(p=>`<label class="department-option"><input type="checkbox" value="${p.id}" name="respondent"${checked(d.departments.includes(p.id))}><span><strong>${p.name}</strong><small>${p.description}</small></span><em>${p.unit}</em></label>`).join('')}</div></section><div id="routing-preview" class="routing-preview"></div><label class="field-stack" for="adoption-rationale"><span>Reason for adoption</span><textarea id="adoption-rationale" aria-label="Reason for adoption" rows="3" maxlength="2000" placeholder="Explain how this framework supports the Program">${esc(d.rationale)}</textarea></label><div class="notice">The final action prepares a proposal for independent review. It does not activate the adoption or issue assessments.</div></div></section>`;}
function routing(){const d=draft(),owner=owners.find(o=>o.id===d.owner),units=departments.filter(p=>d.departments.includes(p.id));$('#selected-owner').innerHTML=owner?`<div class="owner-card"><span class="person-avatar">${owner.name.split(' ').map(s=>s[0]).join('')}</span><div><strong>${owner.name}</strong><small>${owner.role} · Sample person</small></div></div>`:'';$('#routing-preview').innerHTML=`<strong>Assignment preview</strong>${units.length?`<p>${counts(d).questions} questions across ${counts(d).selected} groups will be assigned to each selected unit.</p><ul>${units.map(p=>`<li>${p.name}</li>`).join('')}</ul><p>The Program Owner coordinates responses where responsibilities overlap.</p>`:'<p>Select a respondent unit to preview the assignment.</p>'}`;}
function bindStep(){if(draft().step===1){$('#requirement-filter').value=filter;$('#requirement-filter').onchange=e=>{filter=e.target.value;const visible=requirements.filter(r=>filter==='all'||(filter==='selected'?['default','custom'].includes(draft().decisions[r.id].mode):draft().decisions[r.id].mode===filter));if(visible.length&&!visible.some(r=>r.id===draft().selected))draft().selected=visible[0].id;rows();detail()};$('#adopt-defaults').onclick=()=>{let n=0;for(const r of requirements){if(draft().decisions[r.id].mode==='pending'&&!draft().decisions[r.id].reason){draft().decisions[r.id]={mode:'default',title:r.title,text:r.text,reason:''};n++}}change();rows();detail();announce(n?`${n} default requirements adopted for this Program.`:'No unflagged defaults remain. Resolve any applicability flags individually.')};rows();detail()}
if(draft().step===2){document.querySelectorAll('[data-question-settings]').forEach(b=>b.onclick=()=>questionSettings(b.dataset.questionSettings));document.querySelectorAll('[data-view-group]').forEach(b=>b.onclick=()=>openQuestions(requirements.find(r=>r.id===b.dataset.viewGroup)));document.querySelectorAll('[data-reviewed]').forEach(input=>input.onchange=()=>{const id=input.dataset.reviewed;draft().settingsReviewed=draft().settingsReviewed.filter(value=>value!==id);if(input.checked)draft().settingsReviewed.push(id);change()})}
if(draft().step===3){$('#program-owner').onchange=e=>{draft().owner=e.target.value;change();routing()};document.querySelectorAll('[name=respondent]').forEach(input=>input.onchange=()=>{draft().departments=[...document.querySelectorAll('[name=respondent]:checked')].map(c=>c.value);change();routing()});$('#adoption-rationale').oninput=e=>{draft().rationale=e.target.value;change()};routing()}}
function reviewHTML(){const d=draft(),data=snapshot(d,program);return `<p>${esc(data.program.code)} · ${esc(data.program.name)}</p><dl class="review-facts"><div><dt>Program scope</dt><dd>${esc(data.program.scope)}</dd></div><div><dt>Program Owner</dt><dd>${esc(data.owner?.name||'Not selected')}</dd></div><div><dt>Respondent units</dt><dd>${data.respondents.map(p=>p.name).join(', ')||'Not selected'}</dd></div><div><dt>Linked questions</dt><dd>${counts(d).questions} across ${counts(d).selected} groups</dd></div></dl><div class="review-block"><h3>Reason for adoption</h3><p>${esc(d.rationale||'Not supplied')}</p></div>${data.requirements.map(r=>`<div class="review-block">${badge(r.programRequirement.mode)}<h3>${esc(r.programRequirement.title)}</h3><p>${esc(r.programRequirement.text)}</p><p class="original">${r.reference} · ${r.questions.length} linked questions · ${d.settingsReviewed.includes(requirements.find(x=>x.code===r.sourceCode).id)?'Settings reviewed':'Settings need review'}</p><details class="review-question-settings"><summary>View question settings</summary>${r.questions.map(q=>`<p class="original"><strong>${esc(q.text)}</strong><br>${q.settings.expiry?`${q.settings.days}-day answer validity`:'No answer expiry'} · ${q.settings.evidence?'Supporting evidence required':'No evidence-presence check'}${q.settings.smart?' · Smart validation configured (sample)':''}</p>`).join('')}</details>${r.programRequirement.mode==='custom'?`<p><strong>Reason:</strong> ${esc(r.programRequirement.reason)}</p><p class="original"><strong>Original preserved:</strong> ${esc(r.original.text)}</p>`:''}</div>`).join('')}${data.excluded.map(r=>`<div class="review-block"><h3>Excluded: ${esc(requirements.find(x=>x.id===r.id).title)}</h3><p>${esc(r.reason)}</p></div>`).join('')}<div class="notice">${isoMode?'Demo only. Review decisions apply to the sample Program in this browser.':'Demo only. No reviewer will be notified and no adoption will be approved.'}</div>`;}
function openReview(submit){if(submit){for(const n of [1,2,3]){const problem=validateStep(draft(),n);if(problem){error(problem);return}}}openModal(submit?'Review your setup':'Selected requirements',submit?'READY FOR DEMO REVIEW':'PROGRAM DRAFT',reviewHTML(),submit?'Send for review (demo)':'Done',()=>{if(!submit)return true;if(isoMode){if(isoState.stage!=='active'||isoActor!=='owner')return 'Switch to Program Owner on an active Program.';if(!saveDraft(false))return 'The adoption draft could not be saved.';const result=isoMove('submitAdoption',draft().rationale);if(result===true){render();announce('Adoption sent to the demo CRO.');}return result;}draft().submitted=true;if(!saveDraft(false)){draft().submitted=false;updateSummary();return 'Browser storage is unavailable. The demo proposal was not saved. You can continue editing.'}render();announce('Demo proposal prepared locally. No reviewer was notified.');return true},{cancel:submit});}
let modalCloseCallback=null;
function openModal(title,kicker,html,confirm,action,options={}){returnFocus=document.activeElement;modalCloseCallback=options.onClose||null;$('#dialog-title').textContent=title;$('#dialog-kicker').textContent=kicker;$('#dialog-content').innerHTML=html;$('#dialog-confirm').textContent=confirm;$('#dialog-cancel').hidden=options.cancel===false;$('#dialog-error').hidden=true;modalAction=action;$('#wizard-dialog').showModal();$('#wizard-dialog').scrollTop=0;$('#dialog-close').focus();}
function closeModal(){if($('#wizard-dialog').open)$('#wizard-dialog').close()}
$('#wizard-dialog').addEventListener('close',()=>{modalAction=null;const callback=modalCloseCallback;modalCloseCallback=null;callback?.();if(returnFocus?.isConnected)returnFocus.focus();else if(draft().step===1)document.querySelector(`[data-requirement="${draft().selected}"]`)?.focus();else $('#step-title')?.focus()});
$('#wizard-dialog').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const controls=[...$('#wizard-dialog').querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
$('#wizard-dialog').addEventListener('click',e=>{if(e.target===$('#wizard-dialog')){const rect=$('#wizard-dialog').getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal()}});
$('#dialog-close').onclick=closeModal;$('#dialog-cancel').onclick=closeModal;$('#dialog-confirm').onclick=()=>{const result=modalAction?.();if(result===true)closeModal();else if(typeof result==='string'){$('#dialog-error').textContent=result;$('#dialog-error').hidden=false;$('#dialog-error').scrollIntoView({block:'nearest'})}};
function saveDraft(notify=true){const d=draft();const time=new Date().toISOString();try{const existing=JSON.parse(localStorage.getItem(storageKey)||'null');const saved=existing?.version===1?existing.drafts:{};d.savedAt=time;const value=JSON.stringify({version:1,drafts:{...saved,[program]:d}});localStorage.setItem(storageKey,value);dirty[program]=false;updateSummary();if(notify)announce('Draft saved in this browser. You can close and resume the prototype.');return true}catch{d.savedAt=null;dirty[program]=true;error('This browser could not save the demo draft. Keep this page open to retain your changes.');return false}}
$('#save-draft').onclick=()=>saveDraft();
$('#program-select').onchange=event=>{
  program=event.target.value;
  filter='all';
  if(isoMode)selectIsoProgram(program);
  render();
  announce(`Showing the separate draft for ${programs[program].name}.`);
};
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>selectStep(Number(b.dataset.step)));
$('#back-step').onclick=()=>selectStep(draft().step-1);$('#next-step').onclick=()=>{const issue=validateStep(draft(),draft().step);if(issue){error(issue);return}if(draft().step===3)openReview(true);else selectStep(draft().step+1)};
$('#review-summary').onclick=()=>openReview(false);
function setTheme(theme){document.documentElement.dataset.theme=theme;$('#theme-toggle').innerHTML=theme==='dark'?'☀':'☾';$('#theme-toggle').setAttribute('aria-label',`Switch to ${theme==='dark'?'light':'dark'} appearance`)}
$('#theme-toggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');setTheme('light');initIso();render();if(storageWarning)error(storageWarning);
document.querySelectorAll('[data-shell-preview]').forEach(a=>a.onclick=e=>{e.preventDefault();openModal('Navigation reference','PROTOTYPE',`<p>The ${esc(a.textContent.trim())} navigation item is retained from the existing shell. This prototype focuses on the adoption wizard.</p><p>Your main app and its navigation are unchanged.</p>`,'Done',()=>true,{cancel:false})});

})();
</script>
</body></html>
