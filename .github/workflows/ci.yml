name: foundation-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/verify_design_references.py
      - run: python3 scripts/verify_framework_parity.py
      - run: python3 scripts/verify_program_parity.py
      - run: python3 scripts/verify_assessment_parity.py
      - run: python3 scripts/verify_coverage_parity.py
      - run: go test ./...
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node --test scripts/program-record.nodecheck.mjs scripts/approved-requirements.nodecheck.mjs scripts/program-inventory.nodecheck.mjs scripts/program-overview.nodecheck.mjs scripts/program-issues.nodecheck.mjs
          npm run build

  program-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clearsight_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: clearsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearsight_test -d clearsight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEARSIGHT_TEST_POSTGRES_DSN: postgres://clearsight_test:local_ci_only@127.0.0.1:5432/clearsight_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL actor-scope integration
        run: go test -mod=readonly -tags=postgres -count=1 -timeout=90s ./internal/programread
