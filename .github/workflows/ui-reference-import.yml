name: Import verified UI reference
on:
  push:
    branches: [design/authoritative-ui-v2.7]
    paths: [.ui-reference-transfer/ready.json]
permissions:
  contents: write
concurrency:
  group: ui-reference-import-v27
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'CloudSpaceLab/clearsight2-grc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/authoritative-ui-v2.7
      - name: Verify and expand the reviewed design bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, lzma, tarfile
          transfer = Path('.ui-reference-transfer')
          manifest = json.loads((transfer / 'ready.json').read_text())
          expected_archive = 'c4aca37dea8315e3977df2b369cf9b948b1cd96d9d5a590573cd92aefcae147f'
          expected_manifest = 'c92d633d1448872664c8c0c4ae7be720fd794a23558ac7b90be37c6e05de7ba7'
          assert manifest['archive_sha256'] == expected_archive
          parts = []
          for part in manifest['parts']:
              assert part['name'].startswith('part-') and '/' not in part['name']
              data = (transfer / part['name']).read_bytes()
              assert len(data) == part['bytes']
              assert hashlib.sha256(data).hexdigest() == part['sha256']
              parts.append(data)
          archive = b''.join(parts)
          assert hashlib.sha256(archive).hexdigest() == expected_archive
          raw = lzma.decompress(archive)
          assert len(raw) < 10 * 1024 * 1024
          destination = Path('docs/design/references/clearsight-v2.7/source')
          assert not destination.exists(), 'Refuse to overwrite an existing design reference'
          destination.mkdir(parents=True)
          with tarfile.open(fileobj=io.BytesIO(raw)) as bundle:
              members = bundle.getmembers()
              assert len(members) == manifest['source_file_count']
              names = set()
              for member in members:
                  name = PurePosixPath(member.name)
                  assert member.isfile() and not name.is_absolute()
                  assert '..' not in name.parts and '\\' not in member.name
                  assert member.name not in names
                  names.add(member.name)
                  target = destination.joinpath(*name.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.extractfile(member).read())
          assert hashlib.sha256((destination / 'docs/SHA256SUMS.json').read_bytes()).hexdigest() == expected_manifest
          print('Expanded', len(names), 'verified design files; archive', expected_archive)
          PY
          cd docs/design/references/clearsight-v2.7/source
          python3 verify_reference.py
          python3 build.py
          python3 verify_reference.py
          for source in assets/*.js; do node --check "$source"; done
      - name: Commit only the verified reference and remove transfer tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ClearSight design reference importer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/references/clearsight-v2.7/source
          git rm -r .ui-reference-transfer .github/workflows/ui-reference-import.yml
          git commit -m 'design: expand verified ClearSight V2.7 reference' -m 'Source archive SHA-256: c4aca37dea8315e3977df2b369cf9b948b1cd96d9d5a590573cd92aefcae147f. Design reference only; production application unchanged.'
          git push origin HEAD:design/authoritative-ui-v2.7
